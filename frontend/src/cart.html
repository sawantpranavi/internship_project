        <div class="container">

            <table border="2">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAll"></th>
                        <th>NAME</th>
                        <th>VENDOR NAME</th>
                        <th>UNIT PRICE</th>
                        <th>QUANTITY</th>
                        <th>TOTAL</th>
                        <th><i class="delete-icon" onclick="confirmDelete()">&#128465;</i></th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
                <!-- Cart items will be populated here dynamically -->
            </table>

            <br>
            <button class="confirm-order" onclick=>CONFIRM ORDER</button>
            <button class="CONTINUE">CONTINUE SHOPPING</button><br>
        </div>

        <script>
            document.querySelector('.confirm-order').addEventListener('click', async function confirmOrder() {
                try {
                    const response = await fetch('http://localhost:3000/api/imanage/confirmOrder', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include' // Sends the cookies with the request
                    });

                    if (response.ok) {
                        alert('Order confirmed successfully!');
                        loadCartItems(); // Refresh the cart
                        // Optionally, you can redirect the user or clear the cart
                    } else {
                        console.error('Failed to confirm order:', response.statusText);
                    }
                } catch (error) {
                    console.error('Error while confirming order:', error);
                }
            });

            async function loadCartItems() {
                try {
                    const response = await fetch('http://localhost:3000/api/imanage/getCartData', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include' // Sends the cookies with the request
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const cartItems = data.result; // Assuming result contains the cart items

                        populateCartTable(cartItems);
                    } else {
                        console.error('Failed to load cart items:', response.statusText);
                    }
                } catch (error) {
                    console.error('Error while fetching cart items:', error);
                }
            }

            function populateCartTable(cartItems) {
                const cartTable = document.querySelector('.container table');
                const tableBody = cartTable.querySelector('tbody');  // Get the <tbody> element

                // Clear the table body content
                tableBody.innerHTML = '';

                // If cartItems is empty, display a message
                if (cartItems.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7">Your cart is empty.</td></tr>';
                    return;
                }

                cartItems.forEach(item => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
            <td><input type="checkbox"></td>
            <td>${item.name}</td>
            <td>${item.vendor}</td>
            <td>${item.unitPrice}</td>
            <td>${item.quantity}</td>
            <td>${item.unitPrice * item.quantity}</td>
            <td><i class="delete-icon" onclick="confirmDelete(${item.id})">&#128465;</i></td>
        `;

                    tableBody.appendChild(row);
                });
            }

            function confirmDelete(itemId) {
                const isConfirmed = confirm('Are you sure you want to remove this item from the cart?');

                if (isConfirmed) {
                    deleteCartItem(itemId);
                }
            }

            async function deleteCartItem(itemId) {
                try {
                    const response = await fetch(`http://localhost:3000/api/imanage/cart/${itemId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include' // Sends the cookies with the request
                    });

                    if (response.ok) {
                        alert('Item deleted successfully!');
                        loadCartItems(); // Refresh the cart
                    } else {
                        console.error('Failed to delete cart item:', response.statusText);
                    }
                } catch (error) {
                    console.error('Error while deleting cart item:', error);
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                loadCartItems();
            });
        </script>
